# Development only. C1.6-A prepares this file; it does not start containers.
name: indai-ma-keycloak-dev
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:3e1ac632e743660017b1e6bb4c3ffc800fd02c82cdd0db858cd03456a98a8dfc
    platform: linux/amd64
    command: ["start", "--import-realm"]
    env_file:
      - ${INDAI_KEYCLOAK_ENV_FILE:?External compose.env file required}
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?External bootstrap username required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?External bootstrap password required}
      INDAI_STREAMLIT_CLIENT_SECRET: ${INDAI_STREAMLIT_CLIENT_SECRET:?External client secret required}
      KC_ANALYST_A_PASSWORD: ${KC_ANALYST_A_PASSWORD:?External analyst-a password required}
      KC_ANALYST_B_PASSWORD: ${KC_ANALYST_B_PASSWORD:?External analyst-b password required}
      KC_VIEWER_A_PASSWORD: ${KC_VIEWER_A_PASSWORD:?External viewer-a password required}
      KC_OUTSIDER_PASSWORD: ${KC_OUTSIDER_PASSWORD:?External outsider password required}
      KC_DB: dev-file
      KC_CACHE: local
      KC_HOSTNAME: https://localhost:8443
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/dev-tls/localhost-cert.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/dev-tls/localhost-key.pem
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: http
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx768m
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - type: bind
        source: ./realm
        target: /opt/keycloak/data/import
        read_only: true
      - type: bind
        source: ${INDAI_KEYCLOAK_TLS_DIR:?External TLS directory required}
        target: /opt/keycloak/conf/dev-tls
        read_only: true
    mem_limit: 1536m
    mem_reservation: 768m
    cpus: 2.0
    pids_limit: 256
    restart: "no"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '{ printf \"HEAD /health/ready HTTP/1.0\\r\\n\\r\\n\" >&0; grep -q \"HTTP/1.0 200\"; } 0<>/dev/tcp/127.0.0.1/9000'"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 10
    networks: [keycloak-only]
volumes:
  keycloak-data:
networks:
  keycloak-only:
    driver: bridge
    internal: false
